# Testler, Docker gerektirmeden çalışabilmesi için MySQL uyumluluk kipindeki bellek içi H2 kullanır.
# Uygulamanın kendisi her zaman MySQL ile çalışır (bkz. src/main/resources/application.yml).
spring:
  datasource:
    url: jdbc:h2:mem:restoran_pos_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  ai:
    google:
      genai:
        api-key: tanimlanmadi
        embedding:
          api-key: tanimlanmadi

# Ortamda GEMINI_API_KEY tanımlı olsa bile testler dış servise çıkmaz.
pos:
  assistant:
    gemini-api-key: tanimlanmadi

logging:
  level:
    com.restoran.pos: WARN
